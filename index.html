<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tsudoi</title>
<style>
  :root{ --bg:#0d0c0a; --ink:#ece7de; --sub:#8b857a; --heat:#ff3b1f; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(255,59,31,0.10), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:32px; text-align:center;
  }
  .wrap{ max-width:520px; }
  .mark{
    font-size:clamp(44px,11vw,88px); font-weight:800; letter-spacing:2px;
    line-height:1.05; text-transform:uppercase;
  }
  .mark .o{ color:var(--heat); }
  .tag{ margin-top:18px; color:var(--sub); font-size:clamp(13px,3.4vw,16px); letter-spacing:1px; line-height:1.9; }
  .soon{ margin-top:34px; font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:3px; color:var(--heat); text-transform:uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">TSUD<span class="o">O</span>I</div>
    <div class="tag">人と文化が、集う場所。</div>
    <div class="soon">Coming soon</div>
  </div>
</body>
</html>
